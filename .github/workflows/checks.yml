name: Checks

on:
  push:
    branches:
      - '**'
    paths: &check_paths
      - 'apps/web/**'
      - 'crates/**'
      - 'content/**'
      - 'scripts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/checks.yml'
      - '!**/*.[mM][dD]'
      - '!**/*.[mM][dD][xX]'
      - '!**/*.[mM][aA][rR][kK][dD][oO][wW][nN]'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.2'
          cache: npm
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Install Rust and wasm-pack
        run: |
          rustup toolchain install 1.96.0 --profile minimal --target wasm32-unknown-unknown
          rustup component add rustfmt --toolchain 1.96.0-x86_64-unknown-linux-gnu
          rustup component add clippy --toolchain 1.96.0-x86_64-unknown-linux-gnu
          rustup override set 1.96.0
          cargo install wasm-pack --version 0.15.1 --locked
      - run: npm ci
      - run: npm run check
      - run: cargo fmt --all --check
      - name: Build desktop assets for Rust checks
        run: npm exec --workspace apps/web -- vite build --mode desktop
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: npm run build
      - run: npm test
