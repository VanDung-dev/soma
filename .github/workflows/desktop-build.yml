name: Build desktop

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build (or both)
        required: true
        type: choice
        default: all
        options:
          - all
          - windows
          - macos
      create_release:
        description: Create a GitHub Release for this tag after both builds succeed
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform == 'windows' && '["windows"]' || inputs.platform == 'macos' && '["macos"]' || '["windows","macos"]') }}
    runs-on: ${{ matrix.platform == 'windows' && 'windows-2025' || 'xcode-27' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select Xcode 27.2
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select --switch /Applications/Xcode_27.2.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: Validate manual release request
        if: github.event_name == 'workflow_dispatch' && inputs.create_release
        shell: bash
        run: |
          [[ "$GITHUB_REF" == refs/tags/* ]] || { echo 'Select a version tag ref to publish a release.' >&2; exit 1; }
          [[ "${{ inputs.platform }}" == all ]] || { echo 'Select all platforms to publish a release.' >&2; exit 1; }
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.2'
          cache: npm
      - uses: actions/setup-python@v6
        if: runner.os == 'macOS'
        with:
          python-version: '3.13'
      - name: Install macOS DMG tooling
        if: runner.os == 'macOS'
        run: python -m pip install -r scripts/requirements-dmg.txt
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install 1.96.0 --profile minimal --target wasm32-unknown-unknown
          rustup override set 1.96.0
      - name: Read app version and verify tag
        shell: bash
        run: |
          version=$(node scripts/release-version.mjs)
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            printf 'Tag %s must match app version v%s.\n' "$GITHUB_REF_NAME" "$version" >&2
            exit 1
          fi
          printf 'SOMA_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
      - name: Install wasm-pack
        shell: bash
        run: cargo install wasm-pack --version 0.15.1 --locked
      - name: Install macOS Rust targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin
      - run: npm ci
      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm.cmd exec --workspace apps/web -- tauri build --bundles nsis --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Soma build failed' }
          $version = $env:SOMA_VERSION
          $workspace = $env:GITHUB_WORKSPACE
          $installer = Join-Path $workspace "target/x86_64-pc-windows-msvc/release/bundle/nsis/Soma_${version}_x64-setup.exe"
          $artifact = Join-Path $workspace "Soma-windows-x64-setup.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw "Installer was not created: $installer" }
          Copy-Item -LiteralPath $installer -Destination $artifact -Force
          if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) { throw "Artifact copy failed: $artifact" }
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          npm exec --workspace apps/web -- tauri build --bundles app --target aarch64-apple-darwin
          app=target/aarch64-apple-darwin/release/bundle/macos/Soma.app
          architectures=$(lipo -archs "$app/Contents/MacOS/soma")
          [[ "$architectures" == arm64 ]]
          mkdir -p target/aarch64-apple-darwin/release/bundle/dmg
          dmg="target/aarch64-apple-darwin/release/bundle/dmg/Soma_${SOMA_VERSION}_aarch64.dmg"
          dmgbuild -s scripts/macos-dmg-settings.py \
            -D "app=$app" \
            -D "icon=apps/web/src-tauri/icons/icon.icns" \
            -D "background=apps/web/src-tauri/installer-assets/dmg-background.png" \
            Soma "$dmg"
          cp "$dmg" Soma-macos-arm64.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: Soma-${{ matrix.platform }}
          path: ${{ matrix.platform == 'windows' && 'Soma-windows-x64-setup.exe' || 'Soma-macos-arm64.dmg' }}
          archive: false
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.create_release && startsWith(github.ref, 'refs/tags/') && inputs.platform == 'all'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          name: Soma ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-dev') }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
