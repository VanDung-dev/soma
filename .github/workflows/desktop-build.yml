name: Build desktop

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build (or both)
        required: true
        type: choice
        default: all
        options:
          - all
          - windows
          - macos

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform == 'all' && '["windows","macos"]' || format('["{0}"]', inputs.platform)) }}
    runs-on: ${{ matrix.platform == 'windows' && 'windows-2025' || 'macos-15' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.2'
          cache: npm
      - name: Install Rust and wasm-pack
        shell: bash
        run: |
          rustup toolchain install 1.96.0 --profile minimal --target wasm32-unknown-unknown
          rustup override set 1.96.0
          cargo install wasm-pack --version 0.15.1 --locked
      - name: Install macOS Rust targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci
      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm.cmd exec --workspace apps/web -- tauri build --bundles nsis --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Soma build failed' }
          $version = (Get-Content apps/web/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $installer = "target/x86_64-pc-windows-msvc/release/bundle/nsis/Soma_${version}_x64-setup.exe"
          Compress-Archive -LiteralPath $installer -DestinationPath "Soma-windows.zip"
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          npm exec --workspace apps/web -- tauri build --bundles app --target universal-apple-darwin
          app=target/universal-apple-darwin/release/bundle/macos/Soma.app
          architectures=$(lipo -archs "$app/Contents/MacOS/soma")
          [[ " $architectures " == *" x86_64 "* && " $architectures " == *" arm64 "* ]]
          ditto -c -k --sequesterRsrc --keepParent "$app" Soma-macos.zip
      - uses: actions/upload-artifact@v7
        with:
          path: Soma-${{ matrix.platform }}.zip
          archive: false
          if-no-files-found: error
