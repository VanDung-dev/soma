[workspace]
members = ["crates/anatomy_core", "crates/anatomy_wasm", "apps/web/src-tauri"]
default-members = ["crates/anatomy_core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
anatomy_core = { path = "crates/anatomy_core" }
tauri = "2"
tauri-build = "2"
wasm-bindgen = "=0.2.127"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
