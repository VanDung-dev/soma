[workspace]
members = ["crates/core", "crates/renderer", "crates/wasm", "apps/web/src-tauri"]
default-members = ["crates/core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"

[workspace.dependencies]
catalog = { package = "core", path = "crates/core" }
renderer = { path = "crates/renderer" }
glam = "0.34"
tauri = "2"
tauri-build = "2"
wasm-bindgen = "=0.2.127"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
