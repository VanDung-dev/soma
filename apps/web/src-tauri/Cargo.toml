[package]
name = "soma"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
catalog.workspace = true
content = { path = "../../../crates/content" }
getrandom = "0.4"
percent-encoding = "2"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
serde_json.workspace = true
sha2 = "0.10.9"
tauri = { workspace = true, features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = ">=2, <3"
tempfile = "3"
tiny_http = "0.12"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSButton", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSDate", "NSTimer"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
